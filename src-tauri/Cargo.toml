[package]
name = "tauri-app"
version = "0.1.0"
description = "Hybrid Local AI Hub"
authors = ["Raj Baniya"]
edition = "2021"
license = "MIT"
default-run = "tauri-app"


[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hub"
path = "src/bin/cli.rs"

[[bin]]
name = "tauri-app"
path = "src/main.rs"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
notify = "6"
lopdf = "0.32"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"

# Reduce debug symbol bloat for external dependency crates during development
[profile.dev.package."*"]
opt-level = 2
debug = 1

# Lean release builds
[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

