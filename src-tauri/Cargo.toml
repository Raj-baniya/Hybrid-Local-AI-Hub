[package]
name = "hybrid-local-ai-hub-gui"
version = "1.0.0"
description = "Hybrid Local AI Hub GUI Shell"
authors = ["Hybrid Local AI Hub Contributors"]
edition = "2021"

[lib]
name = "hybrid_local_ai_hub_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
sysinfo = "0.33"
dirs = "5.0.1"
hybrid-local-ai-hub = { path = ".." }
