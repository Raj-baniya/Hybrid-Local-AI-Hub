<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hybrid Local AI Hub</title>
    <meta name="description" content="Local-first AI workflow orchestrator with chat-to-graph and interactive visual canvas." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="color:red; padding:20px; z-index:999999; position:absolute; top:0; left:0; background:black; width:100%; height:100%; overflow:auto;"><h2>Global Error</h2><pre>' + event.error?.stack + '</pre></div>';
      });
    </script>
    <script type="module" src="/ui/main.tsx"></script>
  </body>
</html>
