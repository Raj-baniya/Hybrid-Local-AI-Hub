<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hybrid Local AI Hub</title>
    <meta name="description" content="Local-first AI workflow orchestrator with chat-to-graph and interactive visual canvas." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        var el = document.createElement('div');
        el.style.cssText = 'color:red; padding:20px; z-index:999999; position:absolute; top:0; left:0; background:black; width:100%; height:100%; overflow:auto;';
        var h2 = document.createElement('h2');
        h2.textContent = 'Global Error';
        var pre = document.createElement('pre');
        pre.textContent = event.error ? event.error.stack : event.message;
        el.appendChild(h2);
        el.appendChild(pre);
        document.body.appendChild(el);
      });
    </script>
    <script type="module" src="/ui/main.tsx"></script>
  </body>
</html>
